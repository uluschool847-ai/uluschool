name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ulu_school_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ulu_school_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ulu_school_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ulu_school_test?schema=public
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ulu_school_test?schema=public
      E2E_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ulu_school_test?schema=public
      E2E_DATABASE_RESET_ALLOWED: "1"
      AUTH_SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      SEED_PORTAL_PASSWORD: CiOnlyPortalPassword123!
      GOOGLE_TIMEZONE: Africa/Nairobi
      TURNSTILE_ENFORCE: "false"
      CRON_SECRET: ci-only-cron-secret
      REMINDER_CRON_TOKEN: ci-only-reminder-secret
      ALERT_TEST_TOKEN: ci-only-alert-secret
      RUN_A7_POSTGRES_INTEGRATION: "1"
      RUN_A8_POSTGRES_INTEGRATION: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply test database migrations
        run: npx prisma migrate deploy
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Seed deterministic test fixtures
        run: npm run db:seed
      - name: Verify database readiness
        run: npm run db:verify
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        env:
          RUN_SEED_DB_INTEGRATION: "1"
          RUN_S3_POSTGRES_INTEGRATION: "1"
          RUN_TASK3_POSTGRES_INTEGRATION: "1"
        run: npm run test
      - name: Build
        run: npm run build
      - name: Refresh deterministic test fixtures
        run: npm run db:seed
      - name: Release browser gate
        run: npm run test:e2e:release
